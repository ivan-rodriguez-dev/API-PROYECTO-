# ============================================================
#  ComercioControl API - Perfil de implantacion (prod)
#  Sin usuarios de prueba; el primer administrador se crea
#  desde variables de entorno.
# ============================================================
# Puerto asignado por la plataforma (Railway define PORT); 8080 por defecto
server.port=${PORT:8080}
spring.datasource.url=jdbc:sqlite:/data/comerciocontrol.db
# Migracion de datos de ejemplo (ficticios) solo si se define la variable,
# por ejemplo APP_DATOS_INICIALES=classpath:datos-ejemplo.sql
spring.sql.init.data-locations=${APP_DATOS_INICIALES:}
app.documentacion.usuarios-prueba=false
app.documentacion.servidor=/
app.admin.usuario=${APP_ADMIN_USUARIO:}
app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador}
app.admin.password=${APP_ADMIN_PASSWORD:}
