spring.application.name=comerciocontrol-api
server.port=8080

# ------------------------------------------------------------
# Base de datos SQLite (mismo motor que la aplicacion de escritorio)
# ------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:comerciocontrol.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite es un archivo unico: un solo hilo de escritura evita SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Creacion del esquema y datos de prueba (idempotente)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# ------------------------------------------------------------
# Seguridad - JSON Web Token
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=480

# ------------------------------------------------------------
# Reglas de negocio parametrizables
# ------------------------------------------------------------
app.negocio.iva-porcentaje=19
app.negocio.nombre=ComercioControl

# ------------------------------------------------------------
# Documentacion OpenAPI / Swagger UI
# ------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ------------------------------------------------------------
# Respuestas de error legibles
# ------------------------------------------------------------
server.error.include-message=always
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=false

logging.level.org.springframework.jdbc.core=info
